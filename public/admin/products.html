<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Amar Bazar</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Amar Bazar</h2>
        <ul class="sidebar-menu">
            <li><a href="/admin/dashboard.html">Dashboard</a></li>
            <li><a href="/admin/products.html" class="active">Products</a></li>
            <li><a href="/admin/orders.html">Orders</a></li>
            <li><a href="/admin/users.html">Users</a></li>
            <li><a href="/admin/categories.html">Categories</a></li>
            <li><a href="/">View Store</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="admin-header">
            <h1>Manage Products</h1>
            <button onclick="openAddModal()" class="btn btn-primary">Add New Product</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Product</h2>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="prod-name">Product Name</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label for="prod-category">Category</label>
                    <select id="prod-category" required></select>
                </div>
                <div class="form-group">
                    <label for="prod-price">Price (BDT)</label>
                    <input type="number" id="prod-price" required>
                </div>
                <div class="form-group">
                    <label for="prod-stock">Stock</label>
                    <input type="number" id="prod-stock" required>
                </div>
                <div class="form-group">
                    <label for="prod-desc">Description</label>
                    <textarea id="prod-desc" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" onclick="closeModal()" class="btn" style="background: var(--gray);">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            document.getElementById('products-table-body').innerHTML = products.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>৳${p.price}</td>
                    <td>${p.stock}</td>
                    <td>${p.status}</td>
                    <td>
                        <button onclick="deleteProduct(${p.id})" class="btn" style="background: var(--secondary-color); padding: 2px 8px;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadCategories() {
            const res = await fetch('/api/categories');
            const categories = await res.json();
            document.getElementById('prod-category').innerHTML = categories.map(c => `
                <option value="${c.id}">${c.name}</option>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('product-id').value = '';
            document.getElementById('product-form').reset();
            document.getElementById('modal-title').textContent = 'Add Product';
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        async function saveProduct(event) {
            event.preventDefault();
            const name = document.getElementById('prod-name').value;
            const category_id = document.getElementById('prod-category').value;
            const price = document.getElementById('prod-price').value;
            const stock = document.getElementById('prod-stock').value;
            const description = document.getElementById('prod-desc').value;

            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, category_id, price, stock, description })
            });

            if (res.ok) {
                showToast('Product saved successfully.');
                closeModal();
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
                loadProducts();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            loadCategories();
        });
    </script>
</body>
</html>
