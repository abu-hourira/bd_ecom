<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Amar Bazar</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Amar Bazar</h2>
        <ul class="sidebar-menu">
            <li><a href="/admin/dashboard.html" class="active">Dashboard</a></li>
            <li><a href="/admin/products.html">Products</a></li>
            <li><a href="/admin/orders.html">Orders</a></li>
            <li><a href="/admin/users.html">Users</a></li>
            <li><a href="/admin/categories.html">Categories</a></li>
            <li><a href="/">View Store</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="admin-header">
            <h1>Dashboard Overview</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Sales</h3>
                <p id="total-sales">৳0.00</p>
            </div>
            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="total-orders">0</p>
            </div>
            <div class="stat-card">
                <h3>Registered Users</h3>
                <p id="total-users">0</p>
            </div>
        </div>

        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div style="flex: 2; min-width: 300px;" class="table-container">
                <h3>Recent Orders</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Payment</th>
                        </tr>
                    </thead>
                    <tbody id="recent-orders-table">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>

            <div style="flex: 1; min-width: 250px;" class="table-container">
                <h3>Low Stock Alerts</h3>
                <ul id="low-stock-list" style="list-style: none; padding-top: 10px;">
                    <!-- Loaded dynamically -->
                </ul>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadDashboardStats);
    </script>
</body>
</html>
