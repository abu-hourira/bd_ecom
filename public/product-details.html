<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Amar Bazar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">Amar<span>Bazar</span></a>
            <ul class="nav-links" id="nav-links"></ul>
        </nav>
    </header>

    <main class="container" id="product-details-container">
        <!-- Details will load here -->
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        async function loadProductDetails() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if (!slug) return;

            const res = await fetch(`/api/products/${slug}`);
            if (!res.ok) {
                document.getElementById('product-details-container').innerHTML = '<p>Product not found.</p>';
                return;
            }
            const prod = await res.json();

            document.getElementById('product-details-container').innerHTML = `
                <div style="display: flex; gap: 40px; flex-wrap: wrap; background: white; padding: 30px; border-radius: 8px;">
                    <div style="flex: 1; min-width: 300px;">
                        <img src="${prod.images || '/uploads/placeholder.jpg'}" style="width: 100%; border-radius: 8px;" alt="${prod.name}">
                    </div>
                    <div style="flex: 1.2; min-width: 300px;">
                        <h1 style="margin-bottom: 15px;">${prod.name}</h1>
                        <p style="color: var(--gray); margin-bottom: 15px;">Category: ${prod.category_name || 'General'}</p>
                        <h2 style="color: var(--primary-color); margin-bottom: 20px;">৳${prod.discount_price > 0 ? prod.discount_price : prod.price}</h2>
                        <p style="margin-bottom: 25px;">${prod.description || 'No description available.'}</p>
                        <p style="margin-bottom: 15px;">Stock: <strong>${prod.stock > 0 ? prod.stock + ' items available' : 'Out of Stock'}</strong></p>
                        ${prod.stock > 0 ? `<button onclick="addToCart(${prod.id})" class="btn">Add to Cart</button>` : ''}
                    </div>
                </div>
            `;
        }
        document.addEventListener('DOMContentLoaded', loadProductDetails);
    </script>
</body>
</html>
