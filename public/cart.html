<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Amar Bazar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">Amar<span>Bazar</span></a>
            <ul class="nav-links" id="nav-links"></ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Shopping Cart</h2>
        <div id="cart-items">
            <!-- Cart items load here -->
        </div>
        <div style="margin-top: 30px; text-align: right; background: white; padding: 20px; border-radius: 8px;">
            <h3>Total: ৳<span id="cart-total">0.00</span></h3>
            <a href="/checkout.html" class="btn" style="margin-top: 15px;">Proceed to Checkout</a>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
