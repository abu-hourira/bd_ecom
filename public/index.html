<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Bazar - Best E-commerce in Bangladesh</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">Amar<span>Bazar</span></a>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search products...">
                <button onclick="triggerSearch()">Search</button>
            </div>
            <ul class="nav-links" id="nav-links">
                <!-- Dynamic Links -->
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to Amar Bazar</h1>
        <p>Get authentic Bangladeshi products delivered straight to your doorstep.</p>
        <a href="/products.html" class="btn">Shop Now</a>
    </section>

    <main class="container">
        <h2 class="section-title">Shop by Category</h2>
        <div class="categories-grid" id="categories-container">
            <!-- Categories will load here -->
        </div>

        <h2 class="section-title">Featured Products</h2>
        <div class="products-grid" id="products-container">
            <!-- Products will load here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Amar Bazar. All Rights Reserved. Built for Bangladesh.</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        async function loadHomeData() {
            // Load Categories
            const catRes = await fetch('/api/categories');
            const categories = await catRes.json();
            document.getElementById('categories-container').innerHTML = categories.map(cat => `
                <a href="/products.html?category=${cat.slug}" class="category-card">
                    <h3>${cat.name}</h3>
                    <p>${cat.description || ''}</p>
                </a>
            `).join('');

            // Load Products
            const prodRes = await fetch('/api/products');
            const products = await prodRes.json();
            document.getElementById('products-container').innerHTML = products.slice(0, 8).map(prod => `
                <div class="product-card">
                    <img src="${prod.images || '/uploads/placeholder.jpg'}" class="product-image" alt="${prod.name}">
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-price">৳${prod.discount_price > 0 ? prod.discount_price : prod.price}</p>
                        <a href="/product-details.html?slug=${prod.slug}" class="btn btn-primary" style="text-align:center; margin-top:auto;">View Details</a>
                    </div>
                </div>
            `).join('');
        }

        function triggerSearch() {
            const query = document.getElementById('search-input').value;
            window.location.href = `/products.html?search=${encodeURIComponent(query)}`;
        }

        document.addEventListener('DOMContentLoaded', loadHomeData);
    </script>
</body>
</html>
