name: Deploy ENMAR to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: ⚡ Build Standalone Next.js App
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://2E8LEA49oMcJPMU.root:s0BfZSWqb1duWBx3@gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/enmar_db?sslaccept=strict' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'enmar_nextauth_secret_key_2026_super_secure' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'enmar_jwt_secret_key_2026_production' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || 'enmar_secure_master_aes_vault_key_2026_bd' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
        run: npx next build

      - name: 📂 Prepare Deployment Package
        run: |
          mkdir -p dist
          cp -r .next/standalone/* dist/
          mkdir -p dist/.next/static
          cp -r .next/static dist/.next/
          cp -r public dist/
          cp -r prisma dist/
          cat << 'EOF' > dist/.htaccess
          PassengerAppRoot "."
          PassengerAppType node
          PassengerStartupFile server.js
          PassengerNodejs "/usr/bin/node"

          RewriteEngine On
          RewriteRule ^(.*)$ http://127.0.0.1:3000/$1 [P,L]
          EOF

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR || '/' }}
          local-dir: './dist/'
          port: 21
          security: loose
          dangerous-clean-slate: false
