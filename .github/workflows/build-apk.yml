name: 📱 Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build Android Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Rename APK for Distribution
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/*.apk release_apk/ENMAR-Note-Hub.apk

      - name: 🚀 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENMAR-Note-Hub-APK
          path: release_apk/ENMAR-Note-Hub.apk
          retention-days: 30
