# netlify.toml - Optimized Netlify configuration for Next.js 15 & Prisma

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PRISMA_CLI_BINARY_TARGETS = "rhel-openssl-3.0.x"

[functions]
  included_files = ["node_modules/.prisma/**", "prisma/**", "data/**"]
